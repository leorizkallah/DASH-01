   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="23.832" transform="rotate(-0 12.78 23.832)">DASH-01 | current STOP-03 control path</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(47.923438 86.956289)">Operator request</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54.677344 98.959023)">Speed + STOP</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(248.79375 80.955703)">Shared command adapter</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(250.707813 92.957656)">WALK -&gt; BRAKE -&gt; HOLD</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(204.657031 104.960391)">Filtered estimated speed; smooth reference</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(540.424688 80.955312)">Training only: critic</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(500.660625 92.958047)">413 inputs -&gt; 256 -&gt; 256 -&gt; value</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(515.260625 104.960781)">Includes 29 privileged inputs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(41.666406 189.991945)">Observation history</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(43.442188 201.99468)">Joints, torque, IMU,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(16.105469 213.997414)">phase, prior residual, heading</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(15.341406 226.000148)">+ latched gait and task = 384</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(213.05625 201.99507)">Velocity estimator</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(202.153125 213.997023)">384 -&gt; 128 -&gt; 64 -&gt; 3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(394.637656 195.993312)">Actor, 100 Hz</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(365.980625 207.995266)">387 -&gt; 256 -&gt; 256 -&gt; 47</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(359.817344 219.998)">Clipped mean in evaluation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(593.234375 195.993312)">Action split</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(555.492188 207.996047)">41 gait values: cycle latch</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(565.829688 219.998781)">6 residuals: every tick</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(516.292656 320.733312)">Fourier gait + residual corrections</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(528.828594 332.736047)">6 position targets, Kp and Kd</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(559.204375 344.738781)">Joint / slew limits</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(326.517656 320.733312)">Actuation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(271.597344 332.736047)">Simulation: delay + PD + limits</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(270.115313 344.738781)">Runtime: safety, joint map, CAN</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(49.232188 320.733312)">Robot / simulated plant</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(61.150938 332.736047)">Six actuated joints</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(44.561094 344.738781)">Measurements feed back</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="157.86" y="138.0384" transform="rotate(-0 157.86 138.0384)">effective task</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="258.3" y="282.7368" transform="rotate(-0 258.3 282.7368)">normalized observation also enters actor</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.36" y="409.14" transform="rotate(-0 18.36 409.14)">Policy selects gait parameters and joint corrections; it does not directly output motor torques.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5d6470" x="18.36" y="434.088" transform="rotate(-0 18.36 434.088)">Implemented runtime path does not imply hardware validation. STOP-03 results start near stance, directly in HOLD.</text>
   </g>
